<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gabriel Njenga</title>
  </head>
  <body>
    <form>
      <label for="fname">FirstName:</label>
      <input
        type="text"
        id="fname"
        name="fname"
        placeholder="Enter your first name"
        required
      />
      <br />
      <br />
      <label for="lname">LastName:</label>
      <input
        type="text"
        id="lname"
        name="lname"
        placeholder="Enter your last name"
        required
      />
      <br />
      <br />
      <label for="email">Email:</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        required
      />
      <br />
      <br />
      <input type="radio" id="male" name="gender" value="male" />
      <label for="male">Male</label>
      <br />
      <input type="radio" id="female" name="gender" value="female" />
      <label for="female">Female</label>
      <br />
      <br />

      <label for="Pass">Password:</label>
      <input
        type="password"
        id="Pass"
        name="Pass"
        placeholder="Enter your password"
        required
      />
      <br />
      <br />
      <label for="message">Message:</label>
      <textarea
        id="message"
        name="message"
        placeholder="Enter your message"
        required
      ></textarea>
      <br />
      <br />
      <input type="submit" value="Submit" />
      <br />
      <br />
      <button type="button">sign up</button>
      <br />
      <br />
      <button type="button">sign in</button>
    </form>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #07d1c0, #0a7087);
        font-family: Arial, sans-serif;
      }

      form {
        width: 100%;
        max-width: 480px;
        background-color: #ffffff;
        padding: 30px 25px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(8, 32, 86, 0.18);
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #123;
      }

      input,
      textarea {
        width: 100%;
        padding: 12px 10px;
        margin-bottom: 14px;
        border: 1px solid #cfcfcf;
        border-radius: 8px;
        font-size: 14px;
      }

      input:focus,
      textarea:focus {
        outline: none;
        border-color: #0a7087;
        box-shadow: 0 0 0 3px rgba(10, 112, 135, 0.12);
      }

      input[type="radio"] {
        width: auto;
        margin-right: 8px;
      }

      input[type="submit"],
      button {
        background-color: #082056;
        color: white;
        padding: 12px 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        transition: 0.2s ease;
      }

      input[type="submit"]:hover,
      button:hover {
        background-color: #0d3a8f;
      }
    </style>
  </body>
</html>
